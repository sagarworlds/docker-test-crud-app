<div class="dialog-overlay" (click)="onCancel()" role="dialog" aria-modal="true">
  <div class="dialog-panel" (click)="$event.stopPropagation()">

    <!-- Icon -->
    <div class="dialog-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" width="30" height="30">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
    </div>

    <!-- Title & Message -->
    <h2 class="dialog-title">{{ title() }}</h2>
    <p  class="dialog-message">{{ message() }}</p>

    <!-- Actions -->
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="dialog-cancel-btn"  (click)="onCancel()">
        {{ cancelLabel() }}
      </button>
      <button class="btn btn-danger"    id="dialog-confirm-btn" (click)="onConfirm()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" width="15" height="15">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
        </svg>
        {{ confirmLabel() }}
      </button>
    </div>

  </div>
</div>
