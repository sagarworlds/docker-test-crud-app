services:

  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: crud_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-CrudAppDb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CrudAppDb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - crud_network

  # ── .NET 10 Web API ──────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crud_api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-CrudAppDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crud_network
    restart: on-failure

  # ── Angular 22 Frontend (Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crud_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - crud_network

volumes:
  postgres_data:

networks:
  crud_network:
    driver: bridge
