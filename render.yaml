# Render.com Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec

databases:
  # ── Free managed PostgreSQL ──────────────────────────────────
  - name: crud-db
    databaseName: crudappdb
    plan: free

services:

  # ── .NET 10 Web API (Docker) ─────────────────────────────────
  - type: web
    name: crud-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_HTTP_PORTS
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Disable inotify file reloading in cloud container environment
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      # Automatically injected from the crud-db database above
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: crud-db
          property: connectionString
    healthCheckPath: /openapi/v1.json

  # ── Angular 22 Frontend (Static Site — free forever) ─────────
  - type: web
    name: crud-frontend
    runtime: static
    buildCommand: cd frontend && npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist/crud-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
